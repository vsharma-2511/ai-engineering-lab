[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "0.1.0"
description = "Document intelligence RAG pipeline: PDF ingestion, chunking, embeddings, retrieval and QA"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24",
    "watchdog>=4.0",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "scikit-learn>=1.4"]
# LLM providers for question answering; install the one you use.
gemini = ["google-genai>=2.0"]
openai = ["openai>=3.0"]
claude = ["anthropic>=1.0"]
llm = ["google-genai>=2.0", "openai>=3.0", "anthropic>=1.0"]
# The chat interface (streamlit run app.py).
ui = ["streamlit>=1.50"]
# OCR for scanned pages: EasyOCR (default engine) or Docling (tables).
ocr = ["easyocr>=1.7", "pillow>=10"]
docling = ["docling>=2.100"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
