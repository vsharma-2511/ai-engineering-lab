<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Research Agent Live Execution UI</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f8f9fa; color: #212529; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    input[type="text"] { width: 75%; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: 16px; }
    button { padding: 10px 20px; border: none; background: #0d6efd; color: #fff; font-size: 16px; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #6c757d; }
    .event-log { font-family: monospace; font-size: 13px; background: #1e1e1e; color: #00ff66; padding: 15px; border-radius: 6px; height: 180px; overflow-y: auto; white-space: pre-wrap; }
    .report-box { background: #fff; padding: 20px; border-left: 4px solid #0d6efd; min-height: 100px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; background: #e9ecef; font-size: 12px; font-weight: bold; margin-right: 5px; }
  </style>
</head>
<body>

  <h2>🔬 Research Agent Interactive Console</h2>

  <div class="card">
    <div style="display: flex; gap: 10px;">
      <input type="text" id="queryInput" value="What is the inflation rate and GDP growth in Canada for 2024?" placeholder="Ask a research question...">
      <button id="startBtn" onclick="runPipeline()">Run Research</button>
    </div>
  </div>

  <div class="card">
    <h4>Live Pipeline Log Stream (SSE)</h4>
    <div id="log" class="event-log">System idle. Click "Run Research" to start...</div>
  </div>

  <div class="card">
    <h4>Compiled Final Output</h4>
    <div id="reportBox" class="report-box"><em>Report content will appear here upon phase completion...</em></div>
  </div>

  <script>
    let evtSource = null;

    function logMessage(stage, message, data = null) {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      let text = `[${time}] [${stage.toUpperCase()}] ${message}\n`;
      if (data) text += `  └─ ${JSON.stringify(data)}\n`;
      logDiv.textContent += text;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function runPipeline() {
      const query = document.getElementById('queryInput').value.trim();
      if (!query) return;

      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      document.getElementById('log').textContent = '';
      document.getElementById('reportBox').innerHTML = '<em>Executing multi-phase agent DAG...</em>';

      if (evtSource) evtSource.close();

      const url = `/api/v1/research/stream?query=${encodeURIComponent(query)}`;
      evtSource = new EventSource(url);

      // standard SSE event handling
      const events = ['init', 'stage_start', 'decomposition_complete', 'plan_complete', 'execution_complete', 'report_complete', 'error', 'close'];

      events.forEach(eventName => {
        evtSource.addEventListener(eventName, (e) => {
          const payload = JSON.parse(e.data);

          if (eventName === 'report_complete') {
            logMessage(eventName, payload.message);
            const report = payload.payload;
            document.getElementById('reportBox').innerHTML = `
              <h3>${report.title || 'Research Summary'}</h3>
              <div>${report.summary || JSON.stringify(report, null, 2)}</div>
            `;
          } else if (eventName === 'close' || eventName === 'error') {
            logMessage(eventName, payload.message);
            evtSource.close();
            btn.disabled = false;
          } else {
            logMessage(eventName, payload.message, payload.payload);
          }
        });
      });

      evtSource.onerror = (err) => {
        logMessage('connection_error', 'SSE connection lost or closed by server.');
        evtSource.close();
        btn.disabled = false;
      };
    }
  </script>
</body>
</html>
